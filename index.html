<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ผังงานเดินวิ่ง 3 มิติ</title>
<meta name="description" content="ผังจัดกิจกรรมแบบ 3 มิติ โครงการแสงนำใจ ไทยทั้งชาติ เดิน วิ่ง ปั่น ป้องกันอัมพาต ครั้งที่ 12 จังหวัดแพร่ ณ บริเวณกาดสามวัย เทศบาลเมืองแพร่">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;800&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0c3a8c;
    --navy-2: #1556c4;
    --red: #e3262b;
    --yellow: #ffd21f;
    --ink: #14213d;
    --muted: #5b6785;
    --panel: rgba(255, 255, 255, 0.92);
    --panel-line: rgba(12, 58, 140, 0.14);
    --shadow: 0 8px 28px rgba(10, 30, 80, 0.22);
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #bfe3ff; color: var(--ink);
    font-family: "Sarabun", "Noto Sans Thai", "Leelawadee UI", "Tahoma", sans-serif; }
  button { font: inherit; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; touch-action: none; }
  #labels { position: fixed; inset: 0; pointer-events: none; }

  /* ---------- top bar ---------- */
  .topbar { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 20;
    background: var(--panel); border: 1px solid var(--panel-line); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 8px 18px; text-align: center; width: max-content; max-width: min(980px, calc(100vw - 600px)); }
  .topbar h1 { margin: 0; font-family: "Kanit", sans-serif; font-weight: 600; font-size: 18px; line-height: 1.3; color: var(--navy); }
  .topbar h1 b { color: var(--red); }
  .topbar .meta { font-size: 13.5px; color: var(--muted); margin-top: 2px; }
  .topbar .meta span { white-space: nowrap; }

  /* ---------- legend ---------- */
  #legend { position: fixed; top: 92px; left: 12px; z-index: 15; width: 268px; max-height: calc(100vh - 190px);
    display: flex; flex-direction: column;
    background: var(--panel); border: 1px solid var(--panel-line); border-radius: var(--radius); box-shadow: var(--shadow); }
  #legend .lg-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px 6px 14px; }
  #legend h2 { margin: 0; font-family: "Kanit", sans-serif; font-size: 17px; color: var(--navy); }
  #legend .lg-close { display: none; border: 0; background: none; font-size: 22px; line-height: 1; cursor: pointer; color: var(--muted); }
  #legend .lg-fold { border: 0; background: #eef3ff; color: var(--navy); border-radius: 8px; width: 28px; height: 28px; cursor: pointer;
    font-size: 16px; line-height: 1; transition: transform .2s; }
  #legend.folded ul { display: none; }
  #legend.folded .lg-fold { transform: rotate(180deg); }
  #legend.folded { width: auto; }
  #legend.folded .lg-head { padding-bottom: 10px; gap: 12px; }
  #legend ul { list-style: none; margin: 0; padding: 0 8px 10px; overflow-y: auto; }
  #legend li button { width: 100%; display: flex; align-items: flex-start; gap: 8px; border: 0; background: none; cursor: pointer;
    text-align: left; padding: 6px 6px; border-radius: 10px; color: var(--ink); font-size: 14.5px; line-height: 1.35; }
  #legend li button:hover, #legend li button.active { background: #e8f0ff; }
  .nums { display: inline-flex; gap: 3px; flex-shrink: 0; }
  .num { display: inline-grid; place-items: center; min-width: 24px; height: 24px; padding: 0 5px; border-radius: 12px;
    background: var(--red); color: #fff; font-family: "Kanit", sans-serif; font-weight: 600; font-size: 13px; line-height: 1;
    box-shadow: 0 0 0 2px #fff inset; }

  /* ---------- toolbar ---------- */
  .toolbar { position: fixed; right: 12px; top: 92px; z-index: 15; display: flex; flex-direction: column; gap: 8px; }
  .tbtn { display: flex; align-items: center; gap: 8px; border: 1px solid var(--panel-line); background: var(--panel);
    color: var(--navy); border-radius: 12px; padding: 8px 12px; cursor: pointer; box-shadow: var(--shadow);
    font-family: "Kanit", sans-serif; font-size: 14.5px; white-space: nowrap; }
  .tbtn svg { width: 20px; height: 20px; flex-shrink: 0; }
  .tbtn:hover { background: #fff; }
  .tbtn.on { background: var(--navy); color: #fff; border-color: var(--navy); }
  #menuBtn { display: none; }

  /* ---------- info card ---------- */
  #card { position: fixed; left: 50%; bottom: 16px; transform: translate(-50%, 140%); z-index: 18;
    width: min(560px, calc(100vw - 24px)); background: var(--panel); border: 1px solid var(--panel-line);
    border-radius: var(--radius); box-shadow: var(--shadow); padding: 12px 16px 14px; visibility: hidden;
    transition: transform .35s ease, visibility 0s .35s; }
  #card.show { transform: translate(-50%, 0); visibility: visible; transition: transform .35s ease; }
  #card .c-head { display: flex; align-items: center; gap: 10px; }
  #card .c-head .num { min-width: 32px; height: 32px; border-radius: 16px; font-size: 16px; }
  #card h3 { margin: 0; font-family: "Kanit", sans-serif; font-size: 19px; color: var(--navy); flex: 1; line-height: 1.3; }
  #card .c-close { border: 0; background: none; font-size: 24px; cursor: pointer; color: var(--muted); line-height: 1; }
  #card p { margin: 8px 0 0; font-size: 15.5px; line-height: 1.55; }
  #card .c-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  #card .c-actions button { border: 1px solid var(--navy); background: #fff; color: var(--navy); border-radius: 10px;
    padding: 5px 12px; cursor: pointer; font-family: "Kanit", sans-serif; font-size: 14px; }
  #card .c-actions button.primary { background: var(--navy); color: #fff; }
  #tourBar { height: 4px; background: #e3e9f6; border-radius: 2px; margin-top: 10px; overflow: hidden; display: none; }
  #tourBar i { display: block; height: 100%; width: 0; background: var(--red); }

  /* ---------- 3D markers ---------- */
  .marker { pointer-events: auto; cursor: pointer; display: flex; flex-direction: column; align-items: center;
    user-select: none; transition: opacity .2s; }
  .marker .num { min-width: 30px; height: 30px; border-radius: 15px; font-size: 15px; box-shadow: 0 0 0 3px #fff, 0 3px 8px rgba(0,0,0,.35); }
  .marker .nm { margin-top: 5px; background: rgba(12, 58, 140, 0.9); color: #fff; font-family: "Kanit", sans-serif; font-size: 12.5px;
    padding: 2px 8px; border-radius: 8px; white-space: nowrap; max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
  .marker:hover .num, .marker.active .num { background: var(--yellow); color: var(--ink); }
  body.hide-names .marker .nm, .marker.far .nm { display: none; }
  .marker:hover .nm { display: block; }
  .marker.active .nm { display: block !important; background: var(--red); }

  /* ---------- minimap ---------- */
  #minimap { position: fixed; right: 12px; bottom: 16px; z-index: 14; width: 210px; height: 160px;
    background: rgba(255,255,255,.9); border: 1px solid var(--panel-line); border-radius: 12px; box-shadow: var(--shadow); cursor: crosshair; }

  /* ---------- hints / joystick ---------- */
  #hint { position: fixed; left: 50%; top: 92px; transform: translateX(-50%); z-index: 12; background: rgba(20, 33, 61, .82);
    color: #fff; padding: 7px 14px; border-radius: 10px; font-size: 14px; text-align: center; max-width: calc(100vw - 24px);
    transition: opacity .5s; pointer-events: none; }
  #joy { position: fixed; left: 22px; bottom: 26px; z-index: 16; width: 120px; height: 120px; border-radius: 50%;
    background: rgba(255,255,255,.35); border: 2px solid rgba(255,255,255,.8); display: none; touch-action: none; }
  #joy i { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%;
    background: rgba(12, 58, 140, .85); box-shadow: 0 2px 8px rgba(0,0,0,.3); }
  body.walk.touch #joy { display: block; }
  #runBtn { position: fixed; left: 154px; bottom: 50px; z-index: 16; display: none; width: 64px; height: 64px; border-radius: 50%;
    border: 2px solid #fff; background: rgba(227, 38, 43, .85); color: #fff; font-family: "Kanit", sans-serif; font-size: 14px; touch-action: none; }
  body.walk.touch #runBtn { display: block; }
  body.walk.touch #minimap { bottom: auto; top: 92px; }

  /* ---------- loading & poster ---------- */
  #loading { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: linear-gradient(#bfe3ff, #eef7ff);
    font-family: "Kanit", sans-serif; color: var(--navy); font-size: 18px; transition: opacity .6s; }
  #loading .spin { width: 44px; height: 44px; border: 4px solid #cfe0ff; border-top-color: var(--red); border-radius: 50%;
    margin: 0 auto 12px; animation: sp 1s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
  #posterDlg { border: 0; padding: 0; border-radius: var(--radius); box-shadow: var(--shadow); max-width: min(92vw, 720px); background: #fff; }
  #posterDlg::backdrop { background: rgba(10, 20, 50, .6); }
  #posterDlg img { display: block; width: 100%; height: auto; max-height: 84vh; object-fit: contain; }
  #posterDlg button { position: absolute; top: 8px; right: 8px; border: 0; background: rgba(255,255,255,.9); border-radius: 50%;
    width: 36px; height: 36px; font-size: 22px; cursor: pointer; }

  /* ---------- phones ---------- */
  @media (max-width: 1180px) {
    .topbar { left: 294px; right: 170px; transform: none; width: auto; max-width: none; }
  }
  @media (max-width: 768px) {
    .topbar { top: 8px; padding: 6px 12px; left: 12px; right: 64px; transform: none; max-width: none; }
    .topbar h1 { font-size: 14px; }
    .topbar .meta { font-size: 12px; }
    #menuBtn { display: flex; position: fixed; top: 8px; right: 12px; z-index: 21; padding: 10px; }
    #menuBtn span { display: none; }
    #legend { top: 0; left: 0; bottom: 0; max-height: none; width: min(300px, 86vw); border-radius: 0 var(--radius) var(--radius) 0;
      transform: translateX(-105%); transition: transform .3s; z-index: 30; }
    body.legend-open #legend { transform: none; }
    #legend .lg-close { display: block; }
    #legend .lg-fold { display: none; }
    #legend.folded ul { display: block; }
    .toolbar { top: auto; bottom: 12px; right: 12px; left: 12px; flex-direction: row; justify-content: center; flex-wrap: wrap; gap: 6px; }
    .tbtn { padding: 7px 9px; font-size: 13px; }
    .tbtn span { display: none; }
    .tbtn.keep span { display: inline; }
    #card { bottom: 70px; padding: 10px 12px 12px; }
    #card p { font-size: 14.5px; }
    #minimap { width: 140px; height: 108px; top: 84px; bottom: auto; right: 12px; }
    #hint { top: auto; bottom: 120px; font-size: 13px; }
    #joy { bottom: 76px; }
    #runBtn { bottom: 104px; }
    body.walk.touch #minimap { top: 84px; }
  }
</style>
<script type="importmap">
{ "imports": { "three": "./lib/three.module.min.js", "three/addons/": "./lib/" } }
</script>
</head>
<body>
<div id="stage"></div>
<div id="labels"></div>

<header class="topbar">
  <h1>โครงการแสงนำใจ ไทยทั้งชาติ เดิน วิ่ง ปั่น ป้องกันอัมพาต ครั้งที่ <b>12</b> เฉลิมพระเกียรติ จังหวัดแพร่</h1>
  <div class="meta"><span>วันอาทิตย์ที่ 1 พฤศจิกายน 2569</span> · <span>05.00–12.00 น.</span> · <span>ณ บริเวณกาดสามวัย เทศบาลเมืองแพร่</span></div>
</header>

<aside id="legend" aria-label="รายการจุดในงาน">
  <div class="lg-head"><h2>ผังจัดกิจกรรม</h2><button class="lg-fold" id="legendFold" aria-label="ย่อ/ขยายรายการ" title="ย่อ/ขยายรายการ">▴</button><button class="lg-close" id="legendClose" aria-label="ปิด">×</button></div>
  <ul id="legendList"></ul>
</aside>

<button class="tbtn" id="menuBtn" aria-label="รายการจุด">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span>รายการจุด</span>
</button>

<nav class="toolbar">
  <button class="tbtn on" id="btnOrbit" title="มุมมองจากด้านบน หมุน/ซูมได้">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="12" rx="9" ry="4"/><circle cx="12" cy="12" r="2"/><path d="M12 3v3M12 18v3"/></svg><span>มุมสูง</span></button>
  <button class="tbtn" id="btnWalk" title="เดินชมในงานระดับสายตา">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="13" cy="4" r="2"/><path d="M10 21l2-6 3 3v3M9 12l2-4 4 2 2 3M11 8l-2 4"/></svg><span>เดินในงาน</span></button>
  <button class="tbtn" id="btnTour" title="ทัวร์อัตโนมัติทีละจุด">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg><span>ทัวร์อัตโนมัติ</span></button>
  <button class="tbtn" id="btnReset" title="กลับไปภาพรวม">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg><span>ภาพรวม</span></button>
  <button class="tbtn" id="btnNames" title="แสดง/ซ่อนชื่อจุด">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7V4h16v3M9 20h6M12 4v16"/></svg><span>ชื่อจุด</span></button>
  <button class="tbtn" id="btnRunners" title="แสดง/ซ่อนนักวิ่งจำลอง">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="14" cy="4" r="2"/><path d="M6 20l4-5 3 2 2 4M8 11l3-3 4 1 2 4 3 1M11 8l-1 6"/></svg><span>นักวิ่ง</span></button>
  <button class="tbtn" id="btnPoster" title="ดูผังต้นฉบับ">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg><span>ผังต้นฉบับ</span></button>
</nav>

<section id="card" aria-live="polite">
  <div class="c-head"><span class="nums" id="cNums"></span><h3 id="cTitle"></h3><button class="c-close" id="cClose" aria-label="ปิด">×</button></div>
  <p id="cDesc"></p>
  <div class="c-actions" id="cActions"></div>
  <div id="tourBar"><i></i></div>
</section>

<canvas id="minimap" width="420" height="320" title="แผนที่ย่อ: คลิกเพื่อไปยังตำแหน่ง"></canvas>
<div id="hint"></div>
<div id="joy"><i></i></div>
<button id="runBtn">วิ่ง</button>

<dialog id="posterDlg"><img src="assets/poster.jpg" alt="ผังจัดกิจกรรมต้นฉบับ"><button id="posterClose" aria-label="ปิด">×</button></dialog>
<div id="loading"><div><div class="spin"></div>กำลังสร้างผังงาน 3 มิติ…</div></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/CSS2DRenderer.js';

/* =====================================================================
   ข้อมูลจุดต่าง ๆ ในงาน (พิกัดเป็นเมตร: x = ไปทางขวาของผัง, z = ไปทางถนนด้านล่าง)
   ===================================================================== */
const POINTS = {
  1:  { name: 'เวที', pos: [-31, 9], h: 9.5, view: [1, .45, .25], dist: 24,
        desc: 'เวทีหลักสำหรับพิธีเปิด กล่าวรายงาน มอบรางวัล และกิจกรรมบนเวที มีจอ LED และเครื่องเสียงทั้งสองข้าง' },
  2:  { name: 'จุดต้อนรับผู้บริหาร', pos: [-18, 16], h: 3.2,
        desc: 'โต๊ะรับรองและที่นั่งสำหรับผู้บริหารและแขกผู้มีเกียรติ อยู่ติดถนนด้านหน้างาน ใกล้จุดปล่อยตัว' },
  3:  { name: 'จุดน้ำดื่ม', pos: [-4, 17], h: 3.2,
        desc: 'จุดบริการน้ำดื่มด้านหน้างาน ใกล้ซุ้มปล่อยตัว สำหรับผู้ร่วมกิจกรรมก่อนออกตัวและหลังกลับเข้าเส้นชัย' },
  4:  { name: 'จุดฝากของและลงทะเบียนรับรางวัล', pos: [5, 6], h: 4.6,
        desc: 'เต็นท์สีแดงกลางลาน สำหรับฝากสัมภาระก่อนวิ่ง และลงทะเบียนรับรางวัลหลังเข้าเส้นชัย' },
  5:  { name: 'จุดปล่อยตัว (START)', pos: [11, 28], h: 8, view: [-1, .35, .15], dist: 22,
        desc: 'ซุ้มปล่อยตัว START บนถนนหน้ากาดสามวัย ผู้ร่วมกิจกรรมรวมตัวบนถนนก่อนปล่อยตัวตามเวลา' },

        desc: 'รถสุขาเคลื่อนที่ ฝั่งตรงข้ามถนนด้านหน้างาน ใกล้จุดปล่อยตัว' },
  7:  { name: 'จุดปฐมพยาบาล', pos: [32, 38], h: 4.6, view: [-.4, .5, -1],
        desc: 'เต็นท์ปฐมพยาบาลพร้อมรถพยาบาลและเจ้าหน้าที่ประจำ ตรงมุมสี่แยก หากรู้สึกไม่สบาย เจ็บหน้าอก หน้ามืด หรือบาดเจ็บ แจ้งเจ้าหน้าที่ได้ทันที' },
  8:  { name: 'จุดน้ำดื่ม', pos: [27, 13], h: 3.4,
        desc: 'จุดบริการน้ำดื่มด้านขวาของลาน ใกล้รั้วอิฐและแนวพุ่มไม้ ติดกับจุดทิ้งขยะ' },
  9:  { name: 'จุดทิ้งขยะ', pos: [31, 6.5], h: 2.6,
        desc: 'ถังขยะแยกประเภท: สีน้ำเงิน ขยะทั่วไป · สีเขียว ขยะเปียก/เศษอาหาร · สีเหลือง ขยะรีไซเคิล (ขวด แก้ว) · สีแดง ขยะอันตราย' },
  10: { name: 'จุดอาหาร', pos: [22, -6], h: 4.6, view: [1, .55, .55], dist: 26,
        desc: 'แถวเต็นท์สีเหลืองด้านขวาของลาน บริการอาหารสำหรับผู้ร่วมกิจกรรม' },
  11: { name: 'จุดทิ้งขยะ', pos: [21, -22], h: 2.6,
        desc: 'ถังขยะแยกประเภทบริเวณปลายแถวจุดอาหาร ใกล้หลังคาทางเดิน: น้ำเงิน ทั่วไป · เขียว เปียก · เหลือง รีไซเคิล · แดง อันตราย' },
  12: { name: 'จุดกิจกรรม นศ.พยาบาล', pos: [-11, -13], h: 4.8,
        desc: 'เต็นท์สีชมพู จุดกิจกรรมของนักศึกษาพยาบาล อยู่กลางลานด้านใน' },

const UNIT_BOX = new THREE.BoxGeometry(1, 1, 1);

const matCache = new Map();
function mat(color, extra = {}) {
  const key = color + JSON.stringify(extra);
  if (!matCache.has(key)) matCache.set(key, new THREE.MeshStandardMaterial({ color, roughness: 0.82, metalness: 0, ...extra }));
  return matCache.get(key);
}
function shade(m, cast = true) { m.castShadow = cast; m.receiveShadow = true; return m; }
function box(parent, w, h, d, material, x, y, z, ry = 0) {
  const m = shade(new THREE.Mesh(UNIT_BOX, typeof material === 'string' ? mat(material) : material));
  m.scale.set(w, h, d); m.position.set(x, y, z); m.rotation.y = ry;
  parent.add(m); return m;
}
function cyl(parent, rt, rb, h, material, x, y, z, seg = 12) {
  const m = shade(new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), typeof material === 'string' ? mat(material) : material));
  m.position.set(x, y, z); parent.add(m); return m;
}
function group(x = 0, z = 0, ry = 0, parent = scene) {
  const g = new THREE.Group(); g.position.set(x, 0, z); g.rotation.y = ry; parent.add(g); return g;
}
function canvasTex(w, h, draw, repeat) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...repeat); }
  return t;
}
function texPlane(parent, w, h, tex, x, y, z, ry = 0, extra = {}) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshStandardMaterial({ map: tex, roughness: 0.7, ...extra }));
  m.position.set(x, y, z); m.rotation.y = ry; m.receiveShadow = true; parent.add(m); return m;
}
const FONT_H = '"Kanit", "Sarabun", "Noto Sans Thai", "Tahoma", sans-serif';
function fitText(ctx, text, maxW, size, weight = 600) {

}

// ข้อมูลการชนสำหรับโหมดเดิน: [minX, maxX, minZ, maxZ]
const COLLIDERS = [];
function solid(x, z, w, d, ry = 0) {
  const c = Math.abs(Math.cos(ry)), s = Math.abs(Math.sin(ry));
  const hw = (w * c + d * s) / 2, hd = (w * s + d * c) / 2;
  COLLIDERS.push([x - hw, x + hw, z - hd, z + hd]);
}

/* ---------- นักวิ่งจำลองบนถนน ---------- */
const RUNNER_PATH = [[-95, 0], [46, 0], [46, -110]];   // วิ่งจากซ้ายผ่านซุ้ม START ไปเลี้ยวขวาที่สี่แยก
const runnerGroup = new THREE.Group(); scene.add(runnerGroup);
const RUNNERS = [];
const PATH_LEN = (() => { let L = 0; for (let i = 1; i < RUNNER_PATH.length; i++) L += Math.hypot(RUNNER_PATH[i][0] - RUNNER_PATH[i - 1][0], RUNNER_PATH[i][1] - RUNNER_PATH[i - 1][1]); return L; })();
function pathAt(d) {
  for (let i = 1; i < RUNNER_PATH.length; i++) {
    const [ax, az] = RUNNER_PATH[i - 1], [bx, bz] = RUNNER_PATH[i];
    const L = Math.hypot(bx - ax, bz - az);
    if (d <= L || i === RUNNER_PATH.length - 1) { const t = Math.min(d / L, 1); return { x: ax + (bx - ax) * t, z: az + (bz - az) * t, a: Math.atan2(bx - ax, bz - az), seg: i }; }
    d -= L;
  }
}
function buildRunners() {
  const shirts = ['#1556c4', '#ff3fa0', '#2eb84b', '#8b4fd8', '#ffd21f', '#e3262b', '#ffffff', '#00a6c8'];
  for (let i = 0; i < 26; i++) {
    const g = new THREE.Group();
    const shirt = shirts[i % shirts.length];
    const legL = new THREE.Group(), legR = new THREE.Group(), armL = new THREE.Group(), armR = new THREE.Group();
    legL.position.set(-.1, .82, 0); legR.position.set(.1, .82, 0);

    box(legL, .16, .1, .28, '#f2f2f2', 0, -.78, .06); box(legR, .16, .1, .28, '#f2f2f2', 0, -.78, .06);
    armL.position.set(-.3, 1.38, 0); armR.position.set(.3, 1.38, 0);
    box(armL, .11, .5, .11, mat('#e0b48a'), 0, -.25, 0); box(armR, .11, .5, .11, mat('#e0b48a'), 0, -.25, 0);
    const body = box(g, .44, .6, .25, shirt, 0, 1.12, 0);
    box(g, .3, .22, .02, '#ffffff', 0, 1.12, .13);   // bib
    const head = shade(new THREE.Mesh(new THREE.SphereGeometry(.15, 10, 8), mat('#e0b48a'))); head.position.y = 1.6; g.add(head);
    const cap = shade(new THREE.Mesh(new THREE.SphereGeometry(.16, 10, 6, 0, Math.PI * 2, 0, Math.PI / 2), mat(i % 3 ? '#ffffff' : '#0c3a8c'))); cap.position.y = 1.64; g.add(cap);
    g.add(legL, legR, armL, armR);
    runnerGroup.add(g);
    RUNNERS.push({ g, legL, legR, armL, armR, body, d: (i / 26) * PATH_LEN + Math.random() * 3, v: 2.4 + Math.random() * 1.6,
                   lane: (Math.random() - .5) * 6.5, ph: Math.random() * 6 });
  }
}
function updateRunners(dt, t) {
  for (const r of RUNNERS) {
    r.d += r.v * dt; if (r.d > PATH_LEN) r.d -= PATH_LEN;
    const p = pathAt(r.d);
    const ox = p.seg === 1 ? 0 : r.lane, oz = p.seg === 1 ? r.lane : 0;
    r.g.position.set(p.x + ox, Math.abs(Math.sin(t * r.v * 2.6 + r.ph)) * .08, 28 + p.z + oz);
    r.g.rotation.y = p.a;
    const s = Math.sin(t * r.v * 2.6 + r.ph) * .75;
    r.legL.rotation.x = s; r.legR.rotation.x = -s; r.armL.rotation.x = -s; r.armR.rotation.x = s;
  }
}

let mode = 'orbit';

const ease = (t) => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

function flyTo(pos, target, dur = 1.8, done) {
  fly = { from: camera.position.clone(), to: pos.clone(), fromT: currentLook(), toT: target.clone(), t: 0, dur, done };
}
function currentLook() {
  if (mode === 'orbit') return controls.target.clone();
  const d = new THREE.Vector3(); camera.getWorldDirection(d); return camera.position.clone().add(d.multiplyScalar(5));
}
function pointView(no) {
  const p = POINTS[no];
  const target = new THREE.Vector3(p.pos[0], Math.min(p.h * .35, 2.2), p.pos[1]);
  if (mode === 'walk') {
    const dir = new THREE.Vector3(...(p.view || [.7, 0, .75])).setY(0).normalize();
    const back = Math.max(7, (p.dist || 18) * .5);
    const pos = p.walkAt ? new THREE.Vector3(p.walkAt[0], EYE, p.walkAt[1]) : target.clone().add(dir.multiplyScalar(back)); pos.y = EYE;
    [pos.x, pos.z] = collide(pos.x, pos.z);
    target.y = 1.6;
    return { pos, target };
  }
  const dir = new THREE.Vector3(...(p.view || [.7, .62, .75])).normalize();
  return { pos: target.clone().add(dir.multiplyScalar(p.dist || 17)), target };
}
let activeNo = null;

  const v = pointView(no);

  showCard(no);
}

// หันมองด้วยการลาก (เมาส์/นิ้ว) ในโหมดเดิน
let dragId = null, lastX = 0, lastY = 0;
renderer.domElement.addEventListener('pointerdown', (e) => {
  stopTour(true);
  if (mode !== 'walk') return;
  dragId = e.pointerId; lastX = e.clientX; lastY = e.clientY;
  renderer.domElement.setPointerCapture(e.pointerId);
});
renderer.domElement.addEventListener('pointermove', (e) => {
  if (mode !== 'walk' || e.pointerId !== dragId) return;
  const k = isTouch ? .006 : .0042;
  yaw -= (e.clientX - lastX) * k; pitch -= (e.clientY - lastY) * k;
  pitch = Math.max(-1.2, Math.min(1.2, pitch));
  lastX = e.clientX; lastY = e.clientY; fly = null;
});
const endDrag = (e) => { if (e.pointerId === dragId) dragId = null; };
renderer.domElement.addEventListener('pointerup', endDrag);
renderer.domElement.addEventListener('pointercancel', endDrag);
renderer.domElement.addEventListener('wheel', () => stopTour(true), { passive: true });

addEventListener('keydown', (e) => {
  if (e.target.closest && e.target.closest('input,textarea')) return;
  keys[e.code] = true;
  if (mode === 'walk' && ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  if (['KeyW', 'KeyA', 'KeyS', 'KeyD', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) {
    stopTour(true);
    if (mode !== 'walk' && !e.repeat && !e.code.startsWith('Arrow')) setMode('walk');
  }
  if (e.code === 'Escape') { hideCard(); stopTour(); }
});
addEventListener('keyup', (e) => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

// จอยสติ๊กบนมือถือ
const joyEl = document.getElementById('joy'), knob = joyEl.querySelector('i');
let joyId = null;
function joyMove(e) {
  const r = joyEl.getBoundingClientRect();
  let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
  const max = r.width / 2 - 10, len = Math.hypot(dx, dy);
  if (len > max) { dx *= max / len; dy *= max / len; }
  knob.style.transform = `translate(${dx}px, ${dy}px)`;
  joy.x = dx / max; joy.y = dy / max;
}
joyEl.addEventListener('pointerdown', (e) => { joyId = e.pointerId; joyEl.setPointerCapture(e.pointerId); joy.active = true; joyMove(e); stopTour(true); fly = null; });
joyEl.addEventListener('pointermove', (e) => { if (e.pointerId === joyId) joyMove(e); });
const joyEnd = (e) => { if (e.pointerId !== joyId) return; joyId = null; joy.active = false; joy.x = joy.y = 0; knob.style.transform = ''; };
joyEl.addEventListener('pointerup', joyEnd); joyEl.addEventListener('pointercancel', joyEnd);
const runBtn = document.getElementById('runBtn');
runBtn.addEventListener('pointerdown', () => { running = true; });
for (const ev of ['pointerup', 'pointercancel', 'pointerleave']) runBtn.addEventListener(ev, () => { running = false; });

const BOUNDS = [-90, 105, -75, 85];
function updateWalk(dt) {
  let f = 0, s = 0;
  if (keys.KeyW || keys.ArrowUp) f += 1;
  if (keys.KeyS || keys.ArrowDown) f -= 1;
  if (keys.KeyA) s -= 1;
  if (keys.KeyD) s += 1;
  if (keys.ArrowLeft) yaw += dt * 1.8;
  if (keys.ArrowRight) yaw -= dt * 1.8;
  if (joy.active) { f -= joy.y; s += joy.x; }
  const mag = Math.hypot(f, s);
  let moving = false;
  if (mag > .05) {
    if (mag > 1) { f /= mag; s /= mag; }
    fly = null;
    const speed = (keys.ShiftLeft || keys.ShiftRight || running) ? 9 : 4.2;
    const sin = Math.sin(yaw), cos = Math.cos(yaw);
    const nx = camera.position.x + (-sin * f + cos * s) * speed * dt;
    const nz = camera.position.z + (-cos * f - sin * s) * speed * dt;
    const p = collide(nx, nz);
    camera.position.x = p[0]; camera.position.z = p[1];
    moving = true;
  }
  walkBob += moving ? dt * 9 : 0;
  if (!fly) { camera.position.y = EYE + (moving ? Math.sin(walkBob) * .045 : 0); applyLook(); }
}
let walkBob = 0;
function collide(x, z) {
  const r = .35;
  x = Math.max(BOUNDS[0], Math.min(BOUNDS[1], x)); z = Math.max(BOUNDS[2], Math.min(BOUNDS[3], z));
  for (const [x0, x1, z0, z1] of COLLIDERS) {
    if (x > x0 - r && x < x1 + r && z > z0 - r && z < z1 + r) {
      const px = Math.min(x - (x0 - r), (x1 + r) - x), pz = Math.min(z - (z0 - r), (z1 + r) - z);
      if (px < pz) x = (x - (x0 - r) < (x1 + r) - x) ? x0 - r : x1 + r;
      else z = (z - (z0 - r) < (z1 + r) - z) ? z0 - r : z1 + r;
    }
  }
  return [x, z];
}

/* ---------- ทัวร์อัตโนมัติ ---------- */
let tour = null;   // { i, t, phase }
const DWELL = 6.5;
function startTour() {
  if (mode === 'walk') { mode = 'orbit'; document.body.classList.remove('walk'); document.getElementById('btnOrbit').classList.add('on'); document.getElementById('btnWalk').classList.remove('on'); }
  controls.enabled = false;
  tour = { i: 0, t: 0, phase: 'fly' };
  document.getElementById('btnTour').classList.add('on');
  document.getElementById('btnTour').querySelector('span').textContent = 'หยุดทัวร์';
  document.getElementById('tourBar').style.display = 'block';
  tourGo();
}
function tourGo() {
  const no = TOUR[tour.i];
  tour.phase = 'fly'; tour.t = 0;
  focusPoint(no, { dur: 2.4 });
  fly.done = () => { if (tour) { tour.phase = 'dwell'; tour.t = 0; } };
}
function stopTour(fromUser) {
  if (!tour) return;
  tour = null;
  document.getElementById('btnTour').classList.remove('on');
  document.getElementById('btnTour').querySelector('span').textContent = 'ทัวร์อัตโนมัติ';
  document.getElementById('tourBar').style.display = 'none';
  if (mode === 'orbit') { fly = null; controls.enabled = true; }
  if (fromUser) showHint('หยุดทัวร์แล้ว · ควบคุมกล้องได้เอง', 2500);
}
function updateTour(dt) {
  if (!tour) return;
  const bar = document.querySelector('#tourBar i');
  if (tour.phase === 'dwell') {
    tour.t += dt;
    // หมุนรอบจุดช้า ๆ
    const off = camera.position.clone().sub(controls.target);
    off.applyAxisAngle(new THREE.Vector3(0, 1, 0), dt * .12);
    camera.position.copy(controls.target).add(off);
    camera.lookAt(controls.target);
    bar.style.width = ((tour.i + Math.min(tour.t / DWELL, 1)) / TOUR.length * 100) + '%';
    if (tour.t >= DWELL) {
      tour.i++;
      if (tour.i >= TOUR.length) { stopTour(); resetView(); return; }
      tourGo();
    }
  } else bar.style.width = (tour.i / TOUR.length * 100) + '%';
}
function resetView() {
  hideCard();
  if (mode === 'walk') setMode('orbit');
  flyTo(OVERVIEW.pos, OVERVIEW.target, 1.8, () => { controls.enabled = !tour; });
}

/* =====================================================================
   ส่วนติดต่อผู้ใช้
   ===================================================================== */
const cardEl = document.getElementById('card');
function numsHTML(nos) { return nos.map((n) => `<span class="num">${n}</span>`).join(''); }
function showCard(no) {
  const p = POINTS[no];
  setActive(no);
  const grp = LEGEND.find((g) => g.includes(no));
  document.getElementById('cNums').innerHTML = numsHTML([no]);
  document.getElementById('cTitle').textContent = p.name;
  document.getElementById('cDesc').textContent = p.desc;
  const act = document.getElementById('cActions');
  act.innerHTML = '';
  const add = (label, fn, primary) => { const b = document.createElement('button'); b.textContent = label; if (primary) b.className = 'primary'; b.onclick = () => { stopTour(); fn(); }; act.appendChild(b); };
  if (mode === 'orbit') add('🚶 เดินดูจุดนี้', () => { setMode('walk'); setTimeout(() => focusPoint(no), 50); }, true);
  else add('🛰️ ดูจากมุมสูง', () => { setMode('orbit'); setTimeout(() => focusPoint(no), 1700); }, true);
  for (const other of grp) if (other !== no) add(`อีกจุด: หมายเลข ${other}`, () => focusPoint(other));
  const i = TOUR.indexOf(no);
  add('จุดถัดไป ›', () => focusPoint(TOUR[(i + 1) % TOUR.length]));
  cardEl.classList.add('show');
  document.body.classList.remove('legend-open');
}
function hideCard() { cardEl.classList.remove('show'); setActive(null); }
document.getElementById('cClose').onclick = () => { stopTour(); hideCard(); };

function buildLegend() {
  const ul = document.getElementById('legendList');
  for (const nos of LEGEND) {
    const li = document.createElement('li');
    const b = document.createElement('button');
    b.dataset.nos = nos.join(',');
    b.innerHTML = `<span class="nums">${numsHTML(nos)}</span><span>${LEGEND_NAMES[nos.join(',')] || POINTS[nos[0]].name}</span>`;
    b.onclick = () => { stopTour(); focusPoint(nos[0]); };
    li.appendChild(b); ul.appendChild(li);
  }
}

let hintTimer;
const hintEl = document.getElementById('hint');
function showHint(text, ms = 4000) {
  hintEl.textContent = text; hintEl.style.opacity = 1;
  clearTimeout(hintTimer); hintTimer = setTimeout(() => { hintEl.style.opacity = 0; }, ms);
}

document.getElementById('btnOrbit').onclick = () => { stopTour(); setMode('orbit'); };
document.getElementById('btnWalk').onclick = () => { stopTour(); setMode('walk'); };
document.getElementById('btnTour').onclick = () => { tour ? stopTour() : startTour(); };
document.getElementById('btnReset').onclick = () => { stopTour(); resetView(); };
const btnNames = document.getElementById('btnNames');
btnNames.classList.add('on');
btnNames.onclick = () => { document.body.classList.toggle('hide-names'); btnNames.classList.toggle('on', !document.body.classList.contains('hide-names')); };
const btnRunners = document.getElementById('btnRunners');
btnRunners.classList.add('on');
btnRunners.onclick = () => { runnerGroup.visible = !runnerGroup.visible; btnRunners.classList.toggle('on', runnerGroup.visible); };
const dlg = document.getElementById('posterDlg');
document.getElementById('btnPoster').onclick = () => dlg.showModal();
document.getElementById('posterClose').onclick = () => dlg.close();
dlg.addEventListener('click', (e) => { if (e.target === dlg) dlg.close(); });
document.getElementById('menuBtn').onclick = () => document.body.classList.toggle('legend-open');
document.getElementById('legendClose').onclick = () => document.body.classList.remove('legend-open');
const legendEl = document.getElementById('legend');
document.getElementById('legendFold').onclick = () => legendEl.classList.toggle('folded');

/* ---------- แผนที่ย่อ ---------- */
const mm = document.getElementById('minimap'), mmc = mm.getContext('2d');
const MM = { x0: -62, x1: 80, z0: -48, z1: 60 };
function mmXY(x, z) {
  const W = mm.width, H = mm.height, s = Math.min(W / (MM.x1 - MM.x0), H / (MM.z1 - MM.z0));
  const ox = (W - (MM.x1 - MM.x0) * s) / 2, oz = (H - (MM.z1 - MM.z0) * s) / 2;
  return [ox + (x - MM.x0) * s, oz + (z - MM.z0) * s, s];
}
function drawMinimap() {
  const W = mm.width, H = mm.height;
  mmc.clearRect(0, 0, W, H);
  mmc.fillStyle = '#e9dcc2'; mmc.fillRect(0, 0, W, H);
  const rect = (x0, z0, x1, z1, c) => { const [a, b] = mmXY(x0, z0), [c2, d] = mmXY(x1, z1); mmc.fillStyle = c; mmc.fillRect(a, b, c2 - a, d - b); };
  rect(-92, 23.5, 140, 32.5, '#7b7f86'); rect(41.5, -80, 50.5, 95, '#7b7f86');
  rect(-39, -34, 26, -28, '#3a3b40'); rect(-39, -34, -33, -2, '#3a3b40');
  rect(59, -15, 73, 19, '#c9b48e');
  rect(35.2, -28, 38, 20, '#4c9c3c');
  for (const [no, p] of Object.entries(POINTS)) {
    const [x, y, s] = mmXY(p.pos[0], p.pos[1]);
    mmc.fillStyle = +no === activeNo ? '#ffd21f' : '#e3262b';
    mmc.beginPath(); mmc.arc(x, y, 13, 0, 7); mmc.fill();
    mmc.strokeStyle = '#fff'; mmc.lineWidth = 3; mmc.stroke();
    mmc.fillStyle = +no === activeNo ? '#14213d' : '#fff'; mmc.font = `600 15px ${FONT_H}`; mmc.textAlign = 'center'; mmc.textBaseline = 'middle';
    mmc.fillText(no, x, y + 1);
  }
  // ตำแหน่งกล้อง
  const look = mode === 'orbit' ? controls.target : camera.position;
  const [cx, cy] = mmXY(look.x, look.z);
  const d = new THREE.Vector3(); camera.getWorldDirection(d);
  const a = Math.atan2(d.x, d.z);
  mmc.save(); mmc.translate(cx, cy); mmc.rotate(-a);
  mmc.fillStyle = 'rgba(12,58,140,.25)'; mmc.beginPath(); mmc.moveTo(0, 0); mmc.arc(0, 0, 46, Math.PI / 2 - .5, Math.PI / 2 + .5); mmc.fill();
  mmc.fillStyle = '#0c3a8c'; mmc.beginPath(); mmc.moveTo(0, 14); mmc.lineTo(-9, -8); mmc.lineTo(9, -8); mmc.closePath(); mmc.fill();
  mmc.restore();
}
mm.addEventListener('click', (e) => {
  stopTour();
  const r = mm.getBoundingClientRect();
  const px = (e.clientX - r.left) * mm.width / r.width, py = (e.clientY - r.top) * mm.height / r.height;
  const [ox, oz, s] = mmXY(MM.x0, MM.z0);
  const x = MM.x0 + (px - ox) / s, z = MM.z0 + (py - oz) / s;
  if (mode === 'walk') {
    const p = collide(x, z);
    const d = new THREE.Vector3(); camera.getWorldDirection(d);
    flyTo(new THREE.Vector3(p[0], EYE, p[1]), new THREE.Vector3(p[0] + d.x * 5, 1.6, p[1] + d.z * 5), 1.2, () => setLookFrom(new THREE.Vector3(p[0] + d.x * 5, 1.6, p[1] + d.z * 5)));
  } else {
    const off = camera.position.clone().sub(controls.target);
    const tgt = new THREE.Vector3(x, 0, z);
    controls.enabled = false;
    flyTo(tgt.clone().add(off), tgt, 1.2, () => { controls.enabled = true; });
  }
});

/* =====================================================================
   ลูปหลัก
   ===================================================================== */
const clock = new THREE.Clock();
const tmpV = new THREE.Vector3();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;
  if (fly) {
    fly.t += dt / fly.dur;
    const k = ease(Math.min(fly.t, 1));
    camera.position.lerpVectors(fly.from, fly.to, k);
    // ยกกล้องขึ้นเล็กน้อยระหว่างบินในโหมดมุมสูง
    if (mode === 'orbit') camera.position.y += Math.sin(k * Math.PI) * Math.min(18, fly.from.distanceTo(fly.to) * .15);
    const look = tmpV.lerpVectors(fly.fromT, fly.toT, k);
    if (mode === 'orbit') controls.target.copy(look);
    camera.lookAt(look);
    if (fly.t >= 1) { const done = fly.done; fly = null; if (mode === 'walk') setLookFrom(look.clone()); done && done(); }
  } else if (mode === 'orbit' && !tour) controls.update();
  if (mode === 'walk') updateWalk(dt);
  updateTour(dt);
  if (runnerGroup.visible) updateRunners(dt, t);
  for (const p of IDLE) p.g.rotation.y += Math.sin(t * .5 + p.ph) * .002;
  // จางป้ายที่อยู่ไกลมากในโหมดเดิน
  for (const no in markers) {
    const m = markers[no];
    const dist = camera.position.distanceTo(m.obj.position);
    m.el.style.opacity = mode === 'walk' ? Math.max(.25, Math.min(1, 1.4 - dist / 90)) : 1;
    const far = mode === 'orbit' && dist > 85;
    if (far !== m.far) { m.far = far; m.el.classList.toggle('far', far); }
  }
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
  if ((t * 10 | 0) % 2 === 0) drawMinimap();
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); labelRenderer.setSize(innerWidth, innerHeight);
});

/* =====================================================================
   เริ่มต้น
   ===================================================================== */
async function init() {
  try {
    await Promise.race([
      Promise.all([document.fonts.load(`600 40px Kanit`), document.fonts.load(`800 40px Kanit`), document.fonts.load(`400 16px Sarabun`)]),
      new Promise((r) => setTimeout(r, 2500)),
    ]);
  } catch (e) { /* ใช้ฟอนต์สำรองของเครื่อง */ }
  buildSky(); buildGround(); buildRoads();
  buildStage(); buildReception(); buildWater(); buildBaggage(); buildStart(); buildToilets(); buildFirstAid();
  buildBins(); buildFood(); buildNursing(); buildWalkway(); buildBackdrop(); buildPrivateFood();
  buildLandscape(); buildBuildings(); buildCrowd(); buildRunners();
  // ป้ายตั้งสีน้ำเงินตามจุดต่าง ๆ
  for (const [x, z, r] of [[-30, 16, 1.3], [-6, -6, .3], [16, -12, -.5], [-25, -21, .6], [14, 3, -.8], [-38, 20, 1.2]]) standee(x, z, r);
  buildMarkers(); buildLegend();
  animate();
  const ld = document.getElementById('loading');
  ld.style.opacity = 0; setTimeout(() => ld.remove(), 700);
  showHint(isTouch ? 'ลากนิ้วเพื่อหมุน · ถ่างนิ้วเพื่อซูม · แตะหมายเลขเพื่อดูแต่ละจุด'
                   : 'ลากเมาส์เพื่อหมุน · ล้อเมาส์เพื่อซูม · คลิกหมายเลขเพื่อดูแต่ละจุด · กด W เพื่อเริ่มเดิน', 6500);
  const q = new URLSearchParams(location.search);
  if (q.has('tour')) startTour();
  else if (q.has('walk')) setMode('walk');
  else if (q.get('p') && POINTS[q.get('p')]) focusPoint(+q.get('p'));
  window.__ready = true;
  window.__view = { get flying() { return !!fly; }, get mode() { return mode; } };
}
init();
</script>
